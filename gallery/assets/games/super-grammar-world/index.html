<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
    #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { background-color: #5c94fc; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; image-rendering: pixelated; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
    .hud { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 30px; color: white; font-weight: bold; font-size: 20px; text-shadow: 2px 2px #000; }
    .sys-controls { display: flex; gap: 10px; pointer-events: auto; }
    .sys-btn { background: rgba(0, 0, 0, 0.5); border: 2px solid white; border-radius: 5px; color: white; padding: 5px 15px; font-weight: bold; font-family: inherit; cursor: pointer; }
    .sys-btn:active { background: rgba(255, 255, 255, 0.3); }
    .controls { display: flex; justify-content: space-between; padding: 20px 40px; align-items: flex-end; }
    .d-pad, .action-pad { display: flex; gap: 15px; }
    .btn { pointer-events: auto; background: rgba(255, 255, 255, 0.2); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; }
    .btn:active { background: rgba(255, 255, 255, 0.5); }
    .btn-jump { width: 90px; height: 90px; background: rgba(228, 0, 8, 0.4); }
    #message-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; cursor: pointer; z-index: 10; }
    #message-screen.home-mode { background: rgba(0,0,0,0.25); cursor: default; }
    #message-screen h1 { font-size: 50px; margin-bottom: 10px; color: #f8b800; text-shadow: 3px 3px #e40008; text-align: center;}
    .title-letter { -webkit-text-stroke: 2px #000; text-stroke: 2px #000; text-shadow: 3px 3px 0 #000, 3px 3px 0 rgba(0,0,0,0.4); }
    #mode-select { display: none; flex-direction: column; align-items: center; gap: 12px; margin-top: 10px; pointer-events: auto; }
    #mode-select-label { color: #fff; font-size: 16px; letter-spacing: 1px; text-shadow: 2px 2px #000; margin-bottom: 4px; }
    .mode-btn { font-family: inherit; font-size: 20px; font-weight: bold; color: #fff; background: #e40008; border: 3px solid #000; border-radius: 6px; padding: 12px 34px; cursor: pointer; text-shadow: 1px 1px #000; min-width: 220px; box-shadow: 0 3px 0 #7a0004; }
    .mode-btn:active { transform: translateY(2px); box-shadow: none; }
    #mode-btn-toBe { background: #00a800; box-shadow: 0 3px 0 #005400; }
    #mode-btn-toHave { background: #0092d6; box-shadow: 0 3px 0 #004e73; }
    #mode-btn-irregular { background: #e40008; box-shadow: 0 3px 0 #7a0004; }
    #msg-sub { font-size: 20px; }
    #quiz-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center; pointer-events: auto; }
    #quiz-card { background: #5c94fc; border: 6px solid #000; border-radius: 6px; padding: 24px 28px; max-width: 560px; width: 88%; box-shadow: 0 0 0 4px #f8b800; text-align: center; }
    #quiz-heading { color: #f8b800; font-size: 22px; font-weight: bold; text-shadow: 2px 2px #000; margin-bottom: 14px; letter-spacing: 1px; }
    #quiz-sentence { color: #fff; font-size: 19px; line-height: 1.7; text-shadow: 1px 1px #000; margin-bottom: 18px; }
    .subj-underline { text-decoration: underline; text-decoration-color: #ffdd00; text-decoration-thickness: 4px; text-underline-offset: 4px; }
    .tc-underline { text-decoration: underline; text-decoration-color: #000; text-decoration-thickness: 4px; text-underline-offset: 4px; }
    .quiz-blank { color: #ffdd00; font-weight: bold; }
    .quiz-blank.filled { color: #00e600; }
    .tense-label { color: #ffcccc; font-size: 15px; }
    #quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .quiz-opt-btn { font-family: inherit; font-size: 18px; font-weight: bold; background: #f8b800; border: 3px solid #000; border-radius: 5px; padding: 12px; cursor: pointer; color: #000; }
    .quiz-opt-btn:active { background: #ffe066; }
    .quiz-opt-btn:disabled { opacity: 0.7; cursor: default; }
    #quiz-feedback { min-height: 24px; font-size: 17px; font-weight: bold; text-shadow: 1px 1px #000; }
  </style>
</head>

  <div id="message-screen">

  </div>
  <div id="quiz-modal">

</div>

  function buildLevel() {
    blocks = []; enemies = []; collectibles = []; plants = []; lakitus = []; flagpole = null;
    castle = null;
    questionQueueIndex = 0;
    const levelData = LEVELS[currentLevelIndex];
    for (let r = 0; r < levelData.length; r++) {
      for (let c = 0; c < levelData[r].length; c++) {
        let type = levelData[r][c];
        if (type === 'W') blocks.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, type: 'ground' });
        if (type === 'B') blocks.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, type: 'brick' });
        if (type === 'P') blocks.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, type: 'pipe' });
        if (type === 'V') {
          blocks.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, type: 'pipe' });
          plants.push(new PiranhaPlant(c * TILE_SIZE, r * TILE_SIZE));
        }
        if (type === 'Q') blocks.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, type: 'question', used: false });
        if (type === 'M') {
          // A star sitting on top of a golden pipe triggers a grammar question
          // when touched -- reuses the same simple, reliable collectible-pickup
          // logic that coins already use, instead of the less reliable
          // hit-the-block-from-below approach.
          collectibles.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, collected: false, isStar: true, isQuizStar: true });
          blocks.push({ x: c * TILE_SIZE, y: (r + 1) * TILE_SIZE, type: 'goldpipe' });
          blocks.push({ x: c * TILE_SIZE, y: (r + 2) * TILE_SIZE, type: 'goldpipe' });
        }
        if (type === 'S') collectibles.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, collected: false, isStar: true });
        if (type === 'J') collectibles.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, collected: false, isHeart: true });
        if (type === 'C') collectibles.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, collected: false });
        if (type === 'E') enemies.push(new Enemy(c * TILE_SIZE, r * TILE_SIZE));
        if (type === 'L') lakitus.push(new Lakitu(c * TILE_SIZE, r * TILE_SIZE));
        if (type === 'H') castle = { x: c * TILE_SIZE, y: (r + 1) * TILE_SIZE };
        if (type === 'F') {
          flagpole = {
            x: c * TILE_SIZE,
            topY: (r - 7) * TILE_SIZE,
            bottomY: r * TILE_SIZE,
            flagY: (r - 7) * TILE_SIZE + 10,
            timer: 0
          };
        }
      }
    }
  }

  class Player {
    constructor() { this.reset(); }
    reset() {
      this.x = 100; this.y = 200; this.w = 26; this.h = 32;
      this.vx = 0; this.vy = 0; this.speed = 4.5; this.jumpForce = -13.5;
      this.gravity = 0.65; this.grounded = false; this.dead = false;
      this.invuln = 0; this.knockback = 0;
    }
    update() {
      if (this.dead) { this.vy += this.gravity; this.y += this.vy; return; }
      if (this.invuln > 0) this.invuln--;
      if (this.knockback > 0) {
        this.knockback--;
      } else if (keys.left) this.vx = -this.speed;
      else if (keys.right) this.vx = this.speed;
      else this.vx = 0;
      this.x += this.vx; this.checkCollisions(true);
      if (keys.jump && this.grounded && this.knockback === 0) { this.vy = this.jumpForce; this.grounded = false; }
      this.vy += this.gravity; this.y += this.vy; this.grounded = false;
      this.checkCollisions(false);
      if (this.y > 600) triggerGameOver();
    }
    checkCollisions(isX) {
      for (let b of blocks) {
        if (this.x < b.x + TILE_SIZE && this.x + this.w > b.x && this.y < b.y + TILE_SIZE && this.y + this.h > b.y) {
          if (isX) {
            if (this.vx > 0) this.x = b.x - this.w;
            else if (this.vx < 0) this.x = b.x + TILE_SIZE;
            this.vx = 0;
          } else {
            if (this.vy > 0) {
              this.y = b.y - this.h; this.vy = 0; this.grounded = true;
            } else if (this.vy < 0) {
              this.y = b.y + TILE_SIZE; this.vy = 0;
              if (b.type === 'question' && !b.used) { b.used = true; coinCount++; score += 100; }
            }
          }
        }
      }
    }
    draw() { drawSprite(SPRITES.player, this.x, this.y); }
  }

  class Enemy {
    constructor(x, y) { this.x = x; this.y = y; this.w = 32; this.h = 32; this.vx = -1.5; this.vy = 0; this.alive = true; }
    update() {
      if (!this.alive) return;
      this.vy += 0.65; this.x += this.vx;
      for (let b of blocks) {
        if (this.x < b.x + TILE_SIZE && this.x + this.w > b.x && this.y < b.y + TILE_SIZE && this.y + this.h > b.y) {
          if (this.vx > 0) { this.x = b.x - this.w; this.vx *= -1; }
          else if (this.vx < 0) { this.x = b.x + TILE_SIZE; this.vx *= -1; }
        }
      }
      this.y += this.vy;
      for (let b of blocks) {
        if (this.x < b.x + TILE_SIZE && this.x + this.w > b.x && this.y < b.y + TILE_SIZE && this.y + this.h > b.y) {
          if (this.vy > 0) { this.y = b.y - this.h; this.vy = 0; }
        }
      }
    }
    draw() { if (this.alive) drawSprite(SPRITES.goomba, this.x, this.y); }
  }

  class Lakitu {
    constructor(x, y) { this.startX = x; this.x = x; this.y = y; this.w = 32; this.h = 32; this.alive = true; }
    update() {
      if (!this.alive) return;
      // Follows the camera throughout the whole level (instead of stopping
      // near its starting spot), staying just ahead of the player and
      // drifting side to side -- and now drops a Goomba more often.
      this.x = cameraX + 420 + Math.sin(frameCount / 55) * 150;
      if (frameCount > 0 && frameCount % 140 === 0) {
        enemies.push(new Enemy(this.x, this.y + 32));
      }
    }
    draw() { if (this.alive) drawSprite(SPRITES.lakitu, this.x, this.y); }
  }

  class PiranhaPlant {
    constructor(x, y) { this.x = x; this.startY = y; this.y = y; this.w = 32; this.h = 32; }
    update() {
      let cycle = frameCount % 120;
      if (cycle < 30) this.y = this.startY - (cycle / 30) * TILE_SIZE;
      else if (cycle < 60) this.y = this.startY - TILE_SIZE;
      else if (cycle < 90) this.y = this.startY - TILE_SIZE + ((cycle - 60) / 30) * TILE_SIZE;
      else this.y = this.startY;
    }
    draw() { drawSprite(SPRITES.piranha, this.x, this.y); }
  }

  }

  // Advances to the next level after clearing a castle (score/coins/grammar
  // mode carry over) -- same countdown, just a brief "LEVEL n" label first
  // instead of resetting the run.
  function startNextLevel() {
    gameState = 'COUNTDOWN'; timer = 300;
    buildQuestionQueue();
    player.reset(); buildLevel(); cameraX = 0;
    msgScreen.classList.remove('home-mode');
    msgScreen.style.display = 'flex'; msgSub.style.display = 'none';
    msgTitle.innerText = 'LEVEL ' + (currentLevelIndex + 1);
    setTimeout(runCountdown, 1200);
  }

  function runCountdown() {
    let count = 3; msgTitle.innerText = count;
    let cdInterval = setInterval(() => {
      count--;
      if (count > 0) msgTitle.innerText = count;
      else if (count === 0) msgTitle.innerText = "GO!";
      else { clearInterval(cdInterval); msgScreen.style.display = 'none'; gameState = 'PLAY'; }
    }, 1000);
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestionQueue() {
    let bank = TOBE_BANK;
    if (currentMode === 'toHave') bank = TOHAVE_BANK;
    else if (currentMode === 'irregular') bank = IRREGULAR_BANK;
    questionQueue = shuffleArray(bank).slice(0, 10);
    questionQueueIndex = 0;
  }

  function renderQuizSentence(q, revealed) {
    let html = revealed
      ? q.s.replace('___', `<span class="quiz-blank filled">${q.c}</span>`)
      : q.s.replace('___', '<span class="quiz-blank">____</span>');
    if (q.tc) html = html.split(q.tc).join(`<span class="tc-underline">${q.tc}</span>`);
    if (q.subj) html = html.split(q.subj).join(`<span class="subj-underline">${q.subj}</span>`);
    if (q.t) html += ` <span class="tense-label">(${q.t})</span>`;
    return html;
  }

  function openQuizQuestion(block) {
    if (questionQueueIndex >= questionQueue.length) questionQueueIndex = 0;
    const q = questionQueue[questionQueueIndex];
    questionQueueIndex++;
    quizModalOpen = true;
    gameState = 'QUIZ';

    const sentEl = document.getElementById('quiz-sentence');
    sentEl.innerHTML = renderQuizSentence(q, false);

    const opts = shuffleArray([q.c, ...q.o]);
    const btnContainer = document.getElementById('quiz-options');
    btnContainer.innerHTML = '';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt-btn';
      btn.textContent = opt;
      btn.onclick = () => answerQuiz(opt, q, sentEl);
      btnContainer.appendChild(btn);
    });

    document.getElementById('quiz-feedback').textContent = '';
    document.getElementById('quiz-modal').style.display = 'flex';
  }

  function answerQuiz(selected, q, sentEl) {
    const feedback = document.getElementById('quiz-feedback');
    const correct = selected === q.c;
    document.querySelectorAll('.quiz-opt-btn').forEach(b => b.disabled = true);
    if (correct) {
      feedback.textContent = "Correct! Great job!";
      feedback.style.color = '#00e600';
      score += 50;
    } else {
      feedback.textContent = `Not quite. The answer is: ${q.c}`;
      feedback.style.color = '#ff6666';
    }
    sentEl.innerHTML = renderQuizSentence(q, true);

    setTimeout(() => {
      document.getElementById('quiz-modal').style.display = 'none';
      quizModalOpen = false;
      if (gameState === 'QUIZ') gameState = 'PLAY';
    }, 1800);
  }

  function togglePause() {
    if (gameState === 'PLAY' || gameState === 'FLAG_SLIDE' || gameState === 'FLAG_WALK') {
      gameState = 'PAUSE'; msgTitle.innerText = "PAUSED"; msgSub.style.display = 'block';
      msgSub.innerText = "Tap to Resume"; document.getElementById('mode-select').style.display = 'none';
      msgScreen.classList.remove('home-mode');
      msgScreen.style.display = 'flex';
    } else if (gameState === 'PAUSE') {
      gameState = 'PLAY'; msgScreen.style.display = 'none';
    }
  }

  function triggerGameOver() {
    gameState = 'OVER'; player.dead = true; msgTitle.innerText = "GAME OVER";
    msgSub.style.display = 'block'; msgSub.innerText = "Tap to Retry";
    document.getElementById('mode-select').style.display = 'none';
    msgScreen.classList.remove('home-mode');
    msgScreen.style.display = 'flex';
  }

  function triggerWin() {
    gameState = 'WIN'; msgTitle.innerText = "ALL LEVELS CLEARED!";
    msgSub.style.display = 'block'; msgSub.innerText = "Tap to Play Again";
    document.getElementById('mode-select').style.display = 'none';
    msgScreen.classList.remove('home-mode');
    msgScreen.style.display = 'flex';
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = true;
    if (e.key === ' ') {
      if (gameState === 'HOME' || gameState === 'OVER' || gameState === 'WIN') startCountdown();
      else if (gameState === 'PAUSE') togglePause();
    }
    if (e.key === 'Escape' || e.key === 'p') togglePause();
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.jump = false;
  });

  const bindBtn = (id, k) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; }, {passive: false});
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; }, {passive: false});
    el.addEventListener('mousedown', () => keys[k] = true);
    el.addEventListener('mouseup', () => keys[k] = false);
    el.addEventListener('mouseleave', () => keys[k] = false);
  };
  bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-jump', 'jump');
  document.getElementById('btn-pause').addEventListener('click', togglePause);
  document.getElementById('btn-home').addEventListener('click', goHome);

  msgScreen.addEventListener('click', (e) => {
    if (e.target.closest('#mode-select')) return; // let mode buttons handle their own tap
    if (gameState === 'OVER' || gameState === 'WIN') startCountdown();
    else if (gameState === 'PAUSE') togglePause();
  });
  msgScreen.addEventListener('touchstart', (e) => {
    if (e.target.closest('#mode-select')) return; // let mode buttons handle their own tap (iPad-safe)
    e.preventDefault();
    if (gameState === 'OVER' || gameState === 'WIN') startCountdown();
    else if (gameState === 'PAUSE') togglePause();
  }, {passive: false});

  function checkEntityCollision(entity, isFatal = true, isStompable = true) {
    if (player.invuln > 0) return false; // brief immunity right after taking a hit
    if (player.x < entity.x + entity.w && player.x + player.w > entity.x &&
        player.y < entity.y + entity.h && player.y + player.h > entity.y) {
      if (isStompable && player.vy > 0 && player.y + player.h < entity.y + 16) {
        entity.alive = false; player.vy = -9; score += 200; return true;
      } else if (isFatal) {
        if (hearts > 0) {
          hearts--;
          updateHeartsDisplay();
          player.invuln = 90; // ~1.5s of blinking immunity
          player.knockback = 15; // ~0.25s of ignoring input for the bounce
          player.vx = (player.x < entity.x) ? -6 : 6;
          player.vy = -8;
        } else {
          triggerGameOver();
        }
      }
    }
    return false;
  }

  function updateHeartsDisplay() {
    document.getElementById('heartsDisplay').innerText = '♥'.repeat(hearts) + '♡'.repeat(MAX_HEARTS - hearts);
  }

  // ---- Decorative, purely-visual home-screen background (goombas patrolling,
  // Mario walking, a bobbing pipe). Entirely separate from the real level's
  // enemies/player -- never touches real gameplay state. ----
  let homeFrame = 0;
  const homeGoombas = [
    { x: 280, baseX: 280, dir: 1 },
    { x: 560, baseX: 560, dir: -1 },
    { x: 680, baseX: 680, dir: 1 }
  ];
  const homeMario = { x: 420, baseX: 420, dir: -1 };

  function updateAndDrawHomeBackground() {
    homeFrame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const groundY = canvas.height - TILE_SIZE;
    for (let gx = 0; gx < canvas.width + TILE_SIZE; gx += TILE_SIZE) {
      drawSprite(SPRITES.ground, gx, groundY);
    }

    const pipeBob = Math.sin(homeFrame / 45) * 10;
    drawSprite(SPRITES.goldpipe, 90, groundY - TILE_SIZE * 2 + pipeBob);
    drawSprite(SPRITES.goldpipe, 90, groundY - TILE_SIZE + pipeBob);

    homeGoombas.forEach(g => {
      g.x += g.dir * 0.7;
      if (g.x > g.baseX + 70 || g.x < g.baseX - 70) g.dir *= -1;
      drawSprite(SPRITES.goomba, g.x, groundY - TILE_SIZE);
    });

    homeMario.x += homeMario.dir * 1.1;
    if (homeMario.x > homeMario.baseX + 130 || homeMario.x < homeMario.baseX - 130) homeMario.dir *= -1;
    const marioHop = Math.abs(Math.sin(homeFrame / 7)) * 4;
    drawSprite(SPRITES.player, homeMario.x, groundY - TILE_SIZE - marioHop);
  }

  function loop() {
    requestAnimationFrame(loop);

    if (gameState === 'HOME') {
      updateAndDrawHomeBackground();
      return;
    }

    if (gameState === 'PLAY' || gameState === 'FLAG_SLIDE' || gameState === 'FLAG_WALK' || gameState === 'WIN_WAIT') {
      frameCount++;

      if (gameState === 'PLAY') {
        if (frameCount % 60 === 0) timer--;
        if (timer <= 0) triggerGameOver();

        player.update();

        // Flagpole Interaction logic
        if (flagpole && player.x + player.w > flagpole.x + 12 && player.x < flagpole.x + 20 && player.y < flagpole.bottomY + TILE_SIZE) {
            gameState = 'FLAG_SLIDE';
            player.x = flagpole.x - 10;
            player.vx = 0;
            player.vy = 2.5;

            // Apply bonus score based on height attached
            let heightPoints = Math.floor((flagpole.bottomY - player.y) / TILE_SIZE) * 500;
            score += Math.max(100, heightPoints);
        }

        for (let p of plants) {
          p.update();
          if (p.y < p.startY && !player.dead) checkEntityCollision(p, true, false);
        }

        for (let l of lakitus) {
          l.update();
          if (l.alive && !player.dead) checkEntityCollision(l, true, true);
        }

        for (let c of collectibles) {
          if (!c.collected && player.x < c.x + TILE_SIZE && player.x + player.w > c.x &&
              player.y < c.y + TILE_SIZE && player.y + player.h > c.y) {
            c.collected = true;
            if (c.isQuizStar) { score += 500; openQuizQuestion(c); }
            else if (c.isHeart) {
              if (hearts < MAX_HEARTS) { hearts++; updateHeartsDisplay(); score += 200; }
              else { score += 300; } // already full -- bonus score instead
            }
            else if (c.isStar) { score += 1000; }
            else { coinCount++; score += 50; }
          }
        }

        for (let e of enemies) {
          e.update();
          if (e.alive && !player.dead) checkEntityCollision(e, true, true);
        }
        // Clean up enemies that have scrolled well behind the camera -- they
        // can never be reached again since the level only scrolls forward.
        // Keeps the enemy list from growing without bound now that the cloud
        // guy spawns Goombas continuously across the whole level.
        if (frameCount % 60 === 0) {
          enemies = enemies.filter(e => e.x > cameraX - 300);
        }
      } else if (gameState === 'FLAG_SLIDE') {
          player.y += player.vy;

          let maxFlagY = flagpole.bottomY + TILE_SIZE - 24;
          if (flagpole.flagY < maxFlagY) {
              flagpole.flagY += 3;
              if (flagpole.flagY > maxFlagY) flagpole.flagY = maxFlagY;
          }

          let maxPlayerY = flagpole.bottomY + TILE_SIZE - player.h;
          if (player.y >= maxPlayerY) {
              player.y = maxPlayerY;
              player.vy = 0;
              flagpole.timer++;
              if (flagpole.timer > 90) {
                  gameState = 'FLAG_WALK';
                  player.x = flagpole.x + 16; // step out from behind the pole
              }
          }
      } else if (gameState === 'FLAG_WALK') {
          player.vx = 2.5;
          player.x += player.vx;
          player.checkCollisions(true);
          player.vy += player.gravity;
          player.y += player.vy;
          player.checkCollisions(false);

          if (castle && player.x > castle.x - 10) {
              gameState = 'WIN_WAIT';
              if (currentLevelIndex < LEVELS.length - 1) {
                  currentLevelIndex++;
                  setTimeout(startNextLevel, 1000);
              } else {
                  setTimeout(triggerWin, 1000);
              }
          }
      }

      // Camera lock tracking
      if (player.x > cameraX + 350) cameraX = player.x - 350;
      if (player.x < cameraX + 100 && cameraX > 0) cameraX = player.x - 100;

      document.getElementById('scoreDisplay').innerText = String(score).padStart(6, '0');
      document.getElementById('coinDisplay').innerText = String(coinCount).padStart(2, '0');
      document.getElementById('timeDisplay').innerText = String(timer).padStart(3, '0');
      document.getElementById('levelDisplay').innerText = (currentLevelIndex + 1) + '/' + LEVELS.length;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.translate(-cameraX, 0);

    // Layer 1: Piranha Plants
    for (let p of plants) {
      if (p.x + TILE_SIZE >= cameraX && p.x <= cameraX + 800) p.draw();
    }

    // Layer 2: Blocks and Environment
    for (let b of blocks) {
      if (b.x + TILE_SIZE < cameraX || b.x > cameraX + 800) continue;
      if (b.type === 'ground') drawSprite(SPRITES.ground, b.x, b.y);
      if (b.type === 'brick') drawSprite(SPRITES.brick, b.x, b.y);
      if (b.type === 'pipe') drawSprite(SPRITES.pipe, b.x, b.y);
      if (b.type === 'goldpipe') drawSprite(SPRITES.goldpipe, b.x, b.y);
      if (b.type === 'question') {
        if (b.used) {
          ctx.fillStyle = '#884400'; ctx.fillRect(b.x, b.y, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, TILE_SIZE, TILE_SIZE);
        } else { drawSprite(SPRITES.question, b.x, b.y); }
      }

    }

    // Castle (end-of-level backdrop)
    if (castle && castle.x + 200 >= cameraX && castle.x - 200 <= cameraX + 800) {
      let cx = castle.x;
      let cy = castle.y;

      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(cx - 64, cy - 96, 128, 96);
      ctx.fillRect(cx - 48, cy - 160, 96, 64);

      for (let i = 0; i < 4; i++) ctx.fillRect(cx - 64 + i * 38, cy - 112, 16, 16);
      for (let i = 0; i < 3; i++) ctx.fillRect(cx - 48 + i * 40, cy - 176, 16, 16);

      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.strokeRect(cx - 64, cy - 96, 128, 96);
      ctx.strokeRect(cx - 48, cy - 160, 96, 64);

      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx, cy - 32, 24, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - 24, cy - 32, 48, 32);

      ctx.fillRect(cx - 24, cy - 128, 16, 24);
      ctx.fillRect(cx + 8, cy - 128, 16, 24);
    }

    // Layer 3: Flagpole custom rendering
    if (flagpole && flagpole.x + TILE_SIZE >= cameraX && flagpole.x <= cameraX + 800) {
      let fx = flagpole.x;
      let fy = flagpole.topY;
      let bottomY = flagpole.bottomY;

      // Pole Line
      ctx.fillStyle = '#80e000';
      ctx.fillRect(fx + 12, fy, 6, bottomY - fy + TILE_SIZE);

      // Top Finial Bulb
      ctx.fillStyle = '#00a800';
      ctx.beginPath(); ctx.arc(fx + 15, fy, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#80e000';
      ctx.beginPath(); ctx.arc(fx + 15, fy, 6, 0, Math.PI*2); ctx.fill();

      // Flag Triangle
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(fx + 12, flagpole.flagY);
      ctx.lineTo(fx - 24, flagpole.flagY + 12);
      ctx.lineTo(fx + 12, flagpole.flagY + 24);
      ctx.fill();

      // Minimal Logo shape on flag
      ctx.fillStyle = '#00a800';
      ctx.beginPath(); ctx.arc(fx - 6, flagpole.flagY + 12, 4, 0, Math.PI*2); ctx.fill();
    }

    // Layer 4: Coins & Entities
    for (let c of collectibles) {
      if (!c.collected && c.x + TILE_SIZE >= cameraX && c.x <= cameraX + 800) drawSprite(c.isHeart ? SPRITES.heart : (c.isStar ? SPRITES.star : SPRITES.coin), c.x, c.y);
    }
    for (let l of lakitus) l.draw();
    for (let e of enemies) e.draw();

    // Layer 5: Player
    if (gameState !== 'WIN_WAIT') {
      const blinking = player.dead || player.invuln > 0;
      if (!blinking || frameCount % 10 < 5) player.draw();
    }

    ctx.restore();
  }

  buildLevel();
  goHome();
  requestAnimationFrame(loop);
</script>

</body>
</html>
